<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Korea 전략본부 Calendar</title>
    <style>
      :root {
        --bg: #eef1f4;
        --panel: #f4f7f9;
        --soft-panel: #edf2f7;
        --card: #f6f8fb;
        --line: #d7dde6;
        --line-strong: #c9d2de;
        --ink: #111827;
        --ink-soft: #384252;
        --muted: #6b7280;
        --shadow: 0 8px 20px rgba(17, 24, 39, 0.04);
        --purple: #7a5de8;
        --blue: #3a8df2;
        --teal: #1ab7b2;
        --orange: #f0a33b;
        --green: #2e9d70;
        --red: #ea6d5a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      body {
        padding: 16px 22px 32px;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-title {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      .month-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 10px 14px;
        background: rgba(255,255,255,0.12);
        border: 1px solid var(--line-strong);
        border-radius: 18px;
        margin-bottom: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
      }

      .month-nav {
        width: 48px;
        height: 48px;
        border: 2px solid var(--ink);
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
        padding: 0;
      }

      .month-label {
        min-width: 190px;
        text-align: center;
        font-size: clamp(24px, 2vw, 36px);
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--ink);
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 18px;
      }

      .filter-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        border-radius: 999px;
        padding: 0 18px;
        font-size: 13px;
        font-weight: 800;
        color: white;
        box-shadow: var(--shadow);
      }

      .filter-pill.newsletter { background: linear-gradient(90deg, #7b5fe6, #8d69fb); }
      .filter-pill.workshop { background: linear-gradient(90deg, #2b8ef4, #3aa0ff); }
      .filter-pill.executive { background: linear-gradient(90deg, #11a9a0, #1ad4c0); }
      .filter-pill.partner { background: linear-gradient(90deg, #f0a33b, #f7b952); }
      .filter-pill.summit { background: linear-gradient(90deg, #2b9b6e, #4ab985); }
      .filter-pill.internal { background: linear-gradient(90deg, #d26176, #ef7f96); }

      .kpi-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .kpi {
        min-height: 122px;
        background: rgba(255,255,255,0.18);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        padding: 16px 18px 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      }

      .kpi-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .kpi-label::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff 0%, #fff 18%, #000 19%, #000 100%);
        display: inline-block;
        box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
      }

      .kpi h3 {
        margin: 14px 0 4px;
        font-size: clamp(26px, 2vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.05em;
        font-weight: 900;
        color: var(--ink);
      }

      .kpi p {
        margin: 0;
        font-size: 18px;
        color: var(--ink-soft);
      }

      .calendar-shell {
        background: rgba(255,255,255,0.16);
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        overflow: hidden;
      }

      .calendar { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }

      .day-header,
      .day-cell {
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .day-header {
        background: rgba(255,255,255,0.06);
        padding: 14px 0 12px;
        text-align: center;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #1f2a37;
      }

      .day-cell {
        position: relative;
        min-height: 170px;
        padding: 10px 8px 10px;
        background: rgba(255,255,255,0.04);
      }

      .day-num {
        display: inline-block;
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 8px;
      }

      .day-cell.empty {
        background: #f3f5f7;
      }

      .event-card {
        background: rgba(255,255,255,0.78);
        border-left: 4px solid var(--event-color, var(--purple));
        border-radius: 10px;
        padding: 9px 12px 10px 14px;
        box-shadow: 0 3px 12px rgba(17, 24, 39, 0.04);
        width: min(100%, 165px);
      }

      .event-card .title {
        display: block;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin-bottom: 7px;
      }

      .event-card .meta {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }

      .event-card .meta::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--event-color, var(--purple));
        display: inline-block;
      }

      .event-card .link {
        display: inline-block;
        margin-top: 8px;
        color: var(--blue);
        text-decoration: none;
        font-size: 12px;
        font-weight: 800;
      }

      .event-card.newsletter { --event-color: var(--purple); }
      .event-card.workshop { --event-color: var(--blue); }
      .event-card.executive { --event-color: var(--teal); }
      .event-card.partner { --event-color: var(--orange); }
      .event-card.summit { --event-color: var(--green); }
      .event-card.internal { --event-color: var(--red); }

      @media (max-width: 720px) {
        body { padding: 12px 12px 24px; }
        .month-bar { gap: 8px; }
        .month-nav { width: 42px; height: 42px; font-size: 22px; }
        .month-label { min-width: 0; }
        .calendar { min-width: 700px; }
        .calendar-shell { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="page-title">Microsoft Korea 전략본부 Calendar</h1>

      <div class="month-bar" aria-label="월 이동">
        <button class="month-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <div class="month-label" id="monthLabel">2026년 9월</div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>

      <div class="filter-row" aria-label="카테고리">
        <span class="filter-pill newsletter">Newsletter</span>
        <span class="filter-pill workshop">Workshop</span>
        <span class="filter-pill executive">Executive</span>
        <span class="filter-pill partner">Partner</span>
        <span class="filter-pill summit">Summit</span>
      </div>

      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">Key Focus</div>
          <h3 id="keyFocusValue">3</h3>
          <p>이번 달 주요 이벤트</p>
        </div>
        <div class="kpi">
          <div class="kpi-label">Executive</div>
          <h3 id="executiveValue">0</h3>
          <p>리더십 제안 및 브리핑</p>
        </div>
      </div>

      <div class="calendar-shell">
        <div class="calendar" id="calendar" aria-label="월별 캘린더"></div>
      </div>
    </div>

    <script>
      const monthState = { year: 2026, monthIndex: 8 };
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const eventsByDate = {
        '2026-06-19': [
          {
            title: 'GitHub Copilot + MAF 해커톤',
            type: 'Workshop',
            category: 'workshop',
            link: 'https://hahaplus7.github.io/newsletter/IDMA_Hackathon_Wrap-up_Report(KR).html'
          }
        ],
        '2026-09-10': [
          {
            title: 'Newsletter for 9월',
            type: 'Newsletter',
            category: 'newsletter',
            link: 'https://hahaplus7.github.io/newsletter/SMEC_KR_CxO_Letter_Sep2026_FINAL.html'
          }
        ],
        '2026-09-15': [
          {
            title: 'Copilot & Agent Day Hands-on Workshop with 소프트웨어원',
            type: 'Workshop',
            category: 'workshop',
            link: 'https://hahaplus7.github.io/newsletter/[Wrap-up]0915_Copilot_Agent_Day_Hands-on_Workshop_with_SoftwareOne_0915.html'
          }
        ],
        '2026-09-30': [
          {
            title: 'Industry Summit Leadership Connection',
            type: 'Summit',
            category: 'summit',
            link: '[Wrap-up_KR] SME&C Leadership Connection at Microsoft Industry Summit (9_30, COEX)_FINAL.html'
          }
        ],
        '2026-10-08': [
          {
            title: 'Newsletter 10월',
            type: 'Newsletter',
            category: 'newsletter',
            link: 'https://hahaplus7.github.io/newsletter/SMEC_KR_CxO_Letter_Oct2026_FINAL.html'
          }
        ],
        '2026-10-21': [
          {
            title: 'Copilot & Agent Day with 씨앤토트',
            type: 'Workshop',
            category: 'workshop',
            link: '[Wrap-up]10월21일_Copilot_Agent_Day_with_씨앤토트_KR.html'
          }
        ]
      };

      function getDateKey(year, monthIndex, day) {
        return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      function updateMonthLabel() {
        const monthLabel = document.getElementById('monthLabel');
        monthLabel.textContent = `${monthState.year}년 ${monthState.monthIndex + 1}월`;
      }

      function updateKpis() {
        const year = monthState.year;
        const monthIndex = monthState.monthIndex;
        const totalDays = new Date(year, monthIndex + 1, 0).getDate();
        let total = 0;
        let executive = 0;

        for (let day = 1; day <= totalDays; day++) {
          const key = getDateKey(year, monthIndex, day);
          (eventsByDate[key] || []).forEach((event) => {
            total += 1;
            if (event.category === 'executive') executive += 1;
          });
        }

        document.getElementById('keyFocusValue').textContent = total;
        document.getElementById('executiveValue').textContent = executive;
      }

      function renderCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '';

        weekdays.forEach((day) => {
          const header = document.createElement('div');
          header.className = 'day-header';
          header.textContent = day;
          cal.appendChild(header);
        });

        const year = monthState.year;
        const monthIndex = monthState.monthIndex;
        const firstDay = new Date(year, monthIndex, 1).getDay();
        const totalDays = new Date(year, monthIndex + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'day-cell empty';
          cal.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
          const key = getDateKey(year, monthIndex, day);
          const cell = document.createElement('div');
          cell.className = 'day-cell';

          const dayNum = document.createElement('span');
          dayNum.className = 'day-num';
          dayNum.textContent = day;
          cell.appendChild(dayNum);

          (eventsByDate[key] || []).forEach((event) => {
            const card = document.createElement('div');
            card.className = `event-card ${event.category}`;

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = event.title;
            card.appendChild(title);

            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = event.type;
            card.appendChild(meta);

            const link = document.createElement('a');
            link.href = event.link || '#';
            link.className = 'link';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = `${event.type} 상세 보기`;
            card.appendChild(link);

            cell.appendChild(card);
          });

          cal.appendChild(cell);
        }
      }

      function moveMonth(offset) {
        const next = new Date(monthState.year, monthState.monthIndex + offset, 1);
        monthState.year = next.getFullYear();
        monthState.monthIndex = next.getMonth();
        updateMonthLabel();
        updateKpis();
        renderCalendar();
      }

      document.getElementById('prevMonth').addEventListener('click', () => moveMonth(-1));
      document.getElementById('nextMonth').addEventListener('click', () => moveMonth(1));

      updateMonthLabel();
      updateKpis();
      renderCalendar();
    </script>
  </body>
</html>
