<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMEC KR CxO Letter calendar</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #e7edf8;
        --text: #1d2433;
        --muted: #667085;
        --primary: #0b57d0;
        --primary-dark: #0a419f;
        --primary-soft: #edf4ff;
        --release: #ffcc4d;
        --release-soft: #fff3cd;
        --release-text: #765600;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 18px;
      }

      .page {
        width: min(1100px, 100%);
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--primary);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 52px);
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 12px auto 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 17px;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(300px, 1fr));
        gap: 28px;
      }

      .month-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 16px 38px rgba(15, 23, 42, 0.08);
        padding: 22px 18px 18px;
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .month-name {
        font-size: 28px;
        font-weight: 800;
      }

      .year-tag {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .weekdays {
        margin-bottom: 10px;
      }

      .weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 0;
      }

      .day {
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
      }

      .day.empty {
        visibility: hidden;
      }

      .day.release {
        background: var(--release-soft);
        border-color: #f5d468;
        font-weight: 800;
        color: var(--release-text);
        box-shadow: inset 0 0 0 1px rgba(255, 204, 77, 0.2);
      }

      .day.release a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: inherit;
        text-decoration: none;
      }

      .issue-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 12px 18px rgba(11, 87, 208, 0.2);
      }

      .issue-link:hover {
        filter: brightness(1.02);
      }

      @media (max-width: 760px) {
        .calendar-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="eyebrow">SMEC KR CxO Letter</p>
        <h1>Newsletter Release Calendar</h1>
        <p class="subtitle">
          매달 둘째주 목요일에 발행되는 뉴스레터는 달력 날짜를 클릭하면 바로 열립니다.
        </p>
      </header>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <script>
      const issues = [
        {
          year: 2026,
          month: 8,
          label: 'September',
          href: './SMEC_KR_CxO_Letter_Sep2026_FINAL.html',
          releaseText: 'September issue • 2026.09.10'
        },
        {
          year: 2026,
          month: 9,
          label: 'October',
          href: './SMEC_KR_CxO_Letter_Oct2026_FINAL.html',
          releaseText: 'October issue • 2026.10.08'
        }
      ];

      function getSecondThursday(year, monthIndex) {
        const first = new Date(year, monthIndex, 1);
        const firstDay = first.getDay();
        const offset = (4 - firstDay + 7) % 7;
        const secondThursday = new Date(year, monthIndex, 1 + offset + 7);
        return secondThursday.getDate();
      }

      function renderCalendar(monthConfig) {
        const monthCard = document.createElement('section');
        monthCard.className = 'month-card';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'month-header';

        const monthName = document.createElement('div');
        monthName.className = 'month-name';
        monthName.textContent = monthConfig.label;

        const yearTag = document.createElement('span');
        yearTag.className = 'year-tag';
        yearTag.textContent = monthConfig.year;

        monthHeader.appendChild(monthName);
        monthHeader.appendChild(yearTag);

        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const weekdayRow = document.createElement('div');
        weekdayRow.className = 'weekdays';
        weekdays.forEach((day) => {
          const el = document.createElement('div');
          el.className = 'weekday';
          el.textContent = day;
          weekdayRow.appendChild(el);
        });

        const daysWrap = document.createElement('div');
        daysWrap.className = 'days';

        const totalDays = new Date(monthConfig.year, monthConfig.month + 1, 0).getDate();
        const firstDay = new Date(monthConfig.year, monthConfig.month, 1).getDay();
        const releaseDay = getSecondThursday(monthConfig.year, monthConfig.month);

        for (let i = 0; i < firstDay; i += 1) {
          const empty = document.createElement('div');
          empty.className = 'day empty';
          empty.textContent = ' ';
          daysWrap.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day += 1) {
          const cell = document.createElement('div');
          cell.className = 'day';

          if (day === releaseDay) {
            cell.classList.add('release');
            const link = document.createElement('a');
            link.href = monthConfig.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = day;
            cell.appendChild(link);
          } else {
            cell.textContent = day;
          }

          daysWrap.appendChild(cell);
        }

        const issueLink = document.createElement('a');
        issueLink.className = 'issue-link';
        issueLink.href = monthConfig.href;
        issueLink.target = '_blank';
        issueLink.rel = 'noopener noreferrer';
        issueLink.textContent = monthConfig.releaseText;

        monthCard.appendChild(monthHeader);
        monthCard.appendChild(weekdayRow);
        monthCard.appendChild(daysWrap);
        monthCard.appendChild(issueLink);
        return monthCard;
      }

      const grid = document.getElementById('calendarGrid');
      issues.forEach((issue) => {
        grid.appendChild(renderCalendar(issue));
      });
    </script>
  </body>
</html>
