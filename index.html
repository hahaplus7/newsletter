<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Wrap-Up Report Calendar</title>
    <style>
      :root {
        --bg: #f2efe9;
        --panel: #f7f5f1;
        --ink: #1d2128;
        --muted: #6c7078;
        --line: #d7d2ca;
        --line-strong: #cfc9c0;
        --tag-blue: #6ea8ff;
        --tag-green: #59b88a;
        --tag-red: #ee7e65;
        --tag-violet: #8b85e7;
        --tag-amber: #d4a15d;
        --tag-newsletter: #7d5df2;
        --chip-bg: #eff5ff;
        --chip-text: #3a4c68;
        --shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Apple SD Gothic Neo", Arial, sans-serif;
      }

      body {
        padding: 18px 20px 32px;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      .month-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .month-nav {
        width: 26px;
        height: 26px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: rgba(255,255,255,0.2);
        color: #4e535b;
        font-size: 20px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .month-select {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.2);
        border-radius: 12px;
        padding: 8px 12px 8px 10px;
        font-size: 16px;
        font-weight: 700;
        color: #1d2128;
      }

      .month-label {
        font-size: 16px;
        font-weight: 700;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 16px;
      }

      .tag {
        border: none;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: white;
        box-shadow: var(--shadow);
        cursor: default;
      }

      .tag.copilot { background: linear-gradient(90deg, #7b9af8, #4f8eea); }
      .tag.cloud { background: linear-gradient(90deg, #4ab37c, #58c6ab); }
      .tag.security { background: linear-gradient(90deg, #7e8df0, #6ea4ff); }
      .tag.multi { background: linear-gradient(90deg, #e78a5d, #d76fb2); }
      .tag.newsletter { background: linear-gradient(90deg, #8a63f5, #a458d1); }

      .publication-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 0 0 18px;
      }

      .publication-card {
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: rgba(255,255,255,0.18);
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }

      .publication-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #5f52a9;
      }

      .publication-label::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(90deg, #8a63f5, #a458d1);
        display: inline-block;
      }

      .publication-card h3 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.3;
      }

      .publication-card p {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .publication-link {
        display: inline-block;
        color: #2a63d9;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .search-box {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.2);
        padding: 9px 10px;
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }

      .search-box::placeholder {
        color: #8a8f96;
      }

      .calendar-shell {
        border: 1px solid var(--line-strong);
        background: rgba(255,255,255,0.18);
        border-radius: 12px;
        overflow: hidden;
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekday,
      .cell {
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .weekday {
        padding: 9px 0 10px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: #4b4f57;
        background: rgba(255,255,255,0.08);
      }

      .cell {
        min-height: 165px;
        padding: 8px 6px 10px;
        background: rgba(255,255,255,0.06);
        position: relative;
      }

      .cell.empty {
        background: #f6f4f1;
      }

      .day-index {
        display: inline-block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #3a3d42;
      }

      .event {
        position: relative;
        margin-bottom: 8px;
        border-radius: 8px;
        padding: 7px 8px 7px 12px;
        background: rgba(255, 255, 255, 0.5);
        border-left: 4px solid var(--event-color, #7d8cf6);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
      }

      .event .title {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 700;
        color: #1d2128;
        display: block;
        margin-bottom: 3px;
      }

      .event .meta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: #7a7f87;
      }

      .event .meta::before {
        content: "◆";
        font-size: 8px;
        color: var(--event-color, #7d8cf6);
        transform: translateY(-1px);
      }

      .event .link {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 700;
        color: #1f6fd6;
        text-decoration: none;
      }

      .event.red { --event-color: #ff6b57; }
      .event.green { --event-color: #50b37a; }
      .event.blue { --event-color: #4d92ff; }
      .event.purple { --event-color: #8d7af8; }
      .event.orange { --event-color: #eaa752; }
      .event.newsletter { --event-color: #8a63f5; }

      @media (max-width: 900px) {
        .search-row,
        .publication-row { grid-template-columns: 1fr; }
        .cell { min-height: 130px; }
      }

      @media (max-width: 640px) {
        body { padding: 10px 12px 24px; }
        .month-bar { margin-bottom: 12px; }
        .calendar { min-width: 640px; }
        .calendar-shell { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="month-bar">
        <button class="month-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <div class="month-select" aria-label="보고서 캘린더">
          <span class="month-label" id="monthLabel">2026년 9월</span>
        </div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>

      <div class="filter-row" aria-label="카테고리 필터">
        <span class="tag newsletter">Newsletter</span>
        <span class="tag copilot">Copilot</span>
        <span class="tag cloud">Cloud &amp; AI</span>
        <span class="tag security">Security</span>
        <span class="tag multi">Multi-Solution</span>
      </div>

      <div class="publication-row" aria-label="발행 일정">
        <div class="publication-card">
          <div class="publication-label">Newsletter</div>
          <h3>2026 Sep / 2nd Thursday</h3>
          <p>Fixed publication date: 2026-09-10</p>
          <a class="publication-link" href="SMEC_KR_CxO_Letter_Sep2026_FINAL.html">Open wrap-up report</a>
        </div>
        <div class="publication-card">
          <div class="publication-label">Newsletter</div>
          <h3>2026 Oct / 2nd Thursday</h3>
          <p>Fixed publication date: 2026-10-08</p>
          <a class="publication-link" href="SMEC_KR_CxO_Letter_Oct2026_FINAL.html">Open wrap-up report</a>
        </div>
      </div>

      <div class="search-row">
        <input class="search-box" type="text" placeholder="검색 (전체/필터/기준)" />
        <input class="search-box" type="text" placeholder="현재 월/기준 검색" />
      </div>

      <div class="calendar-shell">
        <div class="calendar" id="calendar" aria-label="월별 캘린더"></div>
      </div>
    </div>

    <script>
      const month = {
        year: 2026,
        monthIndex: 8,
      };

      const events = {
        '2026-09-10': [
          {
            title: 'Newsletter Wrap-up Report',
            meta: 'Newsletter',
            color: 'newsletter',
            link: 'SMEC_KR_CxO_Letter_Sep2026_FINAL.html'
          }
        ],
        '2026-09-15': [
          {
            title: 'Copilot & Agent Day Hands-on Workshop',
            meta: 'Copilot',
            color: 'red',
            link: encodeURI('[Wrap-up]0915_Copilot_Agent_Day_Hands-on_Workshop_with_SoftwareOne_0915.html')
          }
        ],
        '2026-09-30': [
          {
            title: 'SME&C Leadership Connection at Microsoft Industry Summit',
            meta: 'Cloud & AI',
            color: 'blue',
            link: encodeURI('[Wrap-up_KR] SME&C Leadership Connection at Microsoft Industry Summit (9_30, COEX)_FINAL.html')
          }
        ],
        '2026-10-08': [
          {
            title: 'Newsletter Wrap-up Report',
            meta: 'Newsletter',
            color: 'newsletter',
            link: 'SMEC_KR_CxO_Letter_Oct2026_FINAL.html'
          }
        ],
        '2026-10-21': [
          {
            title: 'Microsoft Copilot & Agent Day with 씨앤토트',
            meta: 'Copilot',
            color: 'red',
            link: encodeURI('[Wrap-up]10월21일_Copilot_Agent_Day_with_씨앤토트_KR.html')
          }
        ]
      };

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function updateMonthLabel() {
        document.getElementById('monthLabel').textContent = `${month.year}년 ${month.monthIndex + 1}월`;
      }

      function renderCalendar() {
        const calendar = document.getElementById('calendar');
        calendar.innerHTML = '';

        weekdays.forEach((label) => {
          const wd = document.createElement('div');
          wd.className = 'weekday';
          wd.textContent = label;
          calendar.appendChild(wd);
        });

        const year = month.year;
        const monthIndex = month.monthIndex;
        const firstDay = new Date(year, monthIndex, 1).getDay();
        const totalDays = new Date(year, monthIndex + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'cell empty';
          calendar.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dateKey = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const cell = document.createElement('div');
          cell.className = 'cell';

          const dayLabel = document.createElement('span');
          dayLabel.className = 'day-index';
          dayLabel.textContent = day;
          cell.appendChild(dayLabel);

          const dayEvents = events[dateKey] || [];
          dayEvents.forEach((event) => {
            const eventBox = document.createElement('div');
            eventBox.className = `event ${event.color}`;

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = event.title;

            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = event.meta;

            const link = document.createElement('a');
            link.href = event.link || '#';
            link.className = 'link';
            link.textContent = 'view report';

            eventBox.appendChild(title);
            eventBox.appendChild(meta);
            eventBox.appendChild(link);
            cell.appendChild(eventBox);
          });

          calendar.appendChild(cell);
        }
      }

      document.getElementById('prevMonth').addEventListener('click', () => {
        month.monthIndex = (month.monthIndex - 1 + 12) % 12;
        if (month.monthIndex === 11) {
          month.year -= 1;
        }
        updateMonthLabel();
        renderCalendar();
      });

      document.getElementById('nextMonth').addEventListener('click', () => {
        month.monthIndex = (month.monthIndex + 1) % 12;
        if (month.monthIndex === 0) {
          month.year += 1;
        }
        updateMonthLabel();
        renderCalendar();
      });

      updateMonthLabel();
      renderCalendar();
    </script>
  </body>
</html>
