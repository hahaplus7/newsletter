<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft 전략본부 뉴스레터 | Calendar</title>
    <style>
      :root {
        --bg-1: #f5f7fb;
        --bg-2: #edf3ff;
        --panel: rgba(255, 255, 255, 0.92);
        --panel-strong: #ffffff;
        --ink: #1d2433;
        --ink-soft: #52607a;
        --line: #e5eaf3;
        --navy: #162b4d;
        --navy-2: #1e3a62;
        --microsoft-blue: #0f6cbd;
        --microsoft-blue-soft: #eaf4ff;
        --gold: #c9a76a;
        --gold-soft: #f7eedb;
        --red: #f25022;
        --green: #7fba00;
        --blue: #00a4ef;
        --yellow: #ffb900;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(15, 108, 189, 0.10), transparent 24%),
                    linear-gradient(180deg, #f7f9fd 0%, #eef3ff 100%);
        color: var(--ink);
      }

      .page {
        max-width: 1220px;
        margin: 0 auto;
        padding: 56px 18px 80px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      .logo {
        display: grid;
        grid-template-columns: repeat(2, 10px);
        gap: 4px;
        padding: 4px;
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 12px 24px rgba(16, 24, 40, 0.05);
      }

      .logo .sq {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }

      .logo .red { background: var(--red); }
      .logo .green { background: var(--green); }
      .logo .blue { background: var(--blue); }
      .logo .yellow { background: var(--yellow); }

      .eyebrow {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--microsoft-blue);
        font-weight: 700;
      }

      .hero {
        text-align: center;
        margin-bottom: 36px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(36px, 4vw, 60px);
        line-height: 1.08;
        letter-spacing: -0.06em;
        color: var(--navy);
      }

      .hero .subtitle {
        max-width: 900px;
        margin: 16px auto 0;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.7;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(290px, 1fr));
        gap: 24px;
      }

      .month-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 24px 18px 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(3px);
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .month-name {
        font-size: clamp(24px, 2vw, 30px);
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.04em;
      }

      .year-tag {
        font-size: 12px;
        font-weight: 700;
        color: var(--microsoft-blue);
        background: var(--microsoft-blue-soft);
        padding: 8px 12px;
        border-radius: 999px;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .weekdays {
        margin-bottom: 10px;
      }

      .weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 4px 0 8px;
      }

      .day {
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 15px;
        color: var(--ink);
        background: transparent;
        border: 1px solid transparent;
      }

      .day.empty {
        visibility: hidden;
      }

      .day.release {
        background: linear-gradient(180deg, var(--gold-soft) 0%, #fffaf2 100%);
        border-color: rgba(201, 167, 106, 0.52);
        color: #735309;
        font-weight: 800;
      }

      .day.release a {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: inherit;
        text-decoration: none;
      }

      .day.future {
        background: #f8fafc;
        border-color: var(--line);
        color: #9aa7bb;
      }

      .issue-link {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 18px;
        padding: 14px 18px;
        border-radius: 14px;
        background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 14px 30px rgba(22, 43, 77, 0.18);
      }

      .issue-link.disabled {
        background: linear-gradient(180deg, #dde6f0 0%, #edf2f7 100%);
        color: #73839d;
        box-shadow: none;
        pointer-events: none;
      }

      .history {
        margin-top: 28px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 24px 20px 20px;
        box-shadow: var(--shadow);
      }

      .history h2 {
        margin: 0 0 16px;
        font-size: 24px;
        color: var(--navy);
      }

      .history-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .history-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel-strong);
      }

      .history-item span {
        color: var(--ink);
        font-weight: 600;
      }

      .history-item a {
        color: var(--microsoft-blue);
        text-decoration: none;
        font-weight: 700;
      }

      .reference {
        margin-top: 22px;
        border-radius: 18px;
        padding: 16px 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(245,247,250,0.9));
        border: 1px solid rgba(201, 167, 106, 0.45);
      }

      .reference strong {
        color: var(--navy);
      }

      .reference a {
        color: var(--microsoft-blue);
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .calendar-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="logo" aria-label="Microsoft logo">
          <span class="sq red"></span>
          <span class="sq green"></span>
          <span class="sq blue"></span>
          <span class="sq yellow"></span>
        </div>
        <p class="eyebrow">Microsoft 전략본부</p>
      </div>

      <header class="hero">
        <h1>뉴스레터</h1>
        <p class="subtitle">
          Microsoft 전략본부의 월간 인사이트와 주요 발표를 한 번에 확인할 수 있는 공개 캘린더입니다.<br />
          고객은 공개 URL을 통해 최신 뉴스레터와 과거 아카이브를 모두 확인할 수 있습니다.
        </p>
      </header>

      <main>
        <div class="calendar-grid" id="calendarGrid"></div>

        <section class="history" aria-label="Historical newsletters">
          <h2>Historical issues</h2>
          <div class="history-list">
            <div class="history-item">
              <span>September 2026</span>
              <a href="./SMEC_KR_CxO_Letter_Sep2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
            </div>
            <div class="history-item">
              <span>October 2026</span>
              <a href="./SMEC_KR_CxO_Letter_Oct2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
            </div>
          </div>
        </section>

        <div class="reference">
          <strong>Reference calendar:</strong>
          <a href="https://janeeyye.github.io/marketing-calendar-public/" target="_blank" rel="noopener noreferrer">Open Microsoft-style marketing calendar</a>
        </div>
      </main>
    </div>

    <script>
      const monthConfig = [
        {
          year: 2026,
          monthIndex: 8,
          monthName: 'September',
          releaseDate: 21,
          href: './SMEC_KR_CxO_Letter_Sep2026_FINAL.html',
          label: 'September issue • 2026.09.21',
          past: true
        },
        {
          year: 2026,
          monthIndex: 9,
          monthName: 'October',
          releaseDate: 15,
          href: './SMEC_KR_CxO_Letter_Oct2026_FINAL.html',
          label: 'October issue • 2026.10.15',
          past: true
        },
        {
          year: 2026,
          monthIndex: 10,
          monthName: 'November',
          releaseDate: 12,
          href: '#',
          label: 'Scheduled • 2026.11.12',
          past: false
        },
        {
          year: 2026,
          monthIndex: 11,
          monthName: 'December',
          releaseDate: 10,
          href: '#',
          label: 'Scheduled • 2026.12.10',
          past: false
        }
      ];

      function renderMonthCard(config) {
        const card = document.createElement('section');
        card.className = 'month-card';

        const header = document.createElement('div');
        header.className = 'month-header';

        const monthName = document.createElement('div');
        monthName.className = 'month-name';
        monthName.textContent = config.monthName;

        const yearTag = document.createElement('span');
        yearTag.className = 'year-tag';
        yearTag.textContent = config.year;

        header.appendChild(monthName);
        header.appendChild(yearTag);

        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const weekdayRow = document.createElement('div');
        weekdayRow.className = 'weekdays';
        weekdays.forEach((day) => {
          const el = document.createElement('div');
          el.className = 'weekday';
          el.textContent = day;
          weekdayRow.appendChild(el);
        });

        const daysWrap = document.createElement('div');
        daysWrap.className = 'days';

        const firstDay = new Date(config.year, config.monthIndex, 1).getDay();
        const totalDays = new Date(config.year, config.monthIndex + 1, 0).getDate();

        for (let i = 0; i < firstDay; i += 1) {
          const empty = document.createElement('div');
          empty.className = 'day empty';
          empty.textContent = ' ';
          daysWrap.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day += 1) {
          const cell = document.createElement('div');
          cell.className = 'day';

          if (day === config.releaseDate && config.past) {
            cell.classList.add('release');
            const link = document.createElement('a');
            link.href = config.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = day;
            cell.appendChild(link);
          } else if (day === config.releaseDate && !config.past) {
            cell.classList.add('future');
            cell.textContent = day;
          } else {
            cell.textContent = day;
          }

          daysWrap.appendChild(cell);
        }

        const link = document.createElement('a');
        link.className = 'issue-link' + (config.past ? '' : ' disabled');
        link.href = config.past ? config.href : '#';
        link.target = config.past ? '_blank' : '';
        link.rel = config.past ? 'noopener noreferrer' : '';
        link.textContent = config.label;

        if (!config.past) {
          link.addEventListener('click', (event) => {
            event.preventDefault();
          });
        }

        card.appendChild(header);
        card.appendChild(weekdayRow);
        card.appendChild(daysWrap);
        card.appendChild(link);

        return card;
      }

      const grid = document.getElementById('calendarGrid');
      monthConfig.forEach((config) => {
        grid.appendChild(renderMonthCard(config));
      });
    </script>
  </body>
</html>
