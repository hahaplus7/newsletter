<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Korea 전략본부 Calendar</title>
    <style>
      :root {
        --ms-bg: #f3f6fb;
        --ms-panel: #ffffff;
        --ms-white: #ffffff;
        --ms-ink: #0f172a;
        --ms-muted: #586579;
        --ms-border: #dfe8f4;
        --ms-surface: #eef5ff;
        --ms-blue: #0f6cbd;
        --ms-blue-dark: #0b4f8a;
        --ms-teal: #0f9d9a;
        --ms-green: #2e7d32;
        --ms-orange: #d97706;
        --ms-red: #c62828;
        --ms-purple: #6b4ecb;
        --ms-slate: #5b6476;
        --ms-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, #f7f9fb 100%);
        color: var(--ms-ink);
      }

      body {
        padding: 28px 20px 40px;
      }

      .page {
        max-width: 1220px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .ms-logo {
        width: 84px;
        height: 84px;
        border-radius: 18px;
        background: linear-gradient(135deg, #0f6cbd 0%, #0b4f8a 55%, #0f9d9a 100%);
        position: relative;
        box-shadow: 0 12px 26px rgba(15, 108, 189, 0.18);
        flex-shrink: 0;
      }

      .ms-logo::before,
      .ms-logo::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 52px;
        height: 52px;
        background: white;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 8px;
        border-radius: 10px;
      }

      .ms-logo::after {
        transform: rotate(90deg);
        opacity: 0.92;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(26px, 2.2vw, 40px);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ms-blue-dark);
      }

      .title-wrap p {
        margin: 6px 0 0;
        color: var(--ms-muted);
        font-size: 14px;
        font-weight: 600;
      }

      .month-nav {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .month-nav button {
        appearance: none;
        border: 1px solid var(--ms-border);
        background: var(--ms-panel);
        color: var(--ms-ink);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
      }

      .month-nav button:hover {
        background: #f0f7ff;
        border-color: #bfd9ff;
      }

      .month-nav button.active {
        background: linear-gradient(135deg, var(--ms-blue), var(--ms-teal));
        border-color: transparent;
        color: white;
        box-shadow: 0 8px 18px rgba(15, 108, 189, 0.18);
      }

      .month-banner {
        border: 1px solid var(--ms-border);
        background: rgba(255,255,255,0.8);
        border-radius: 18px;
        padding: 18px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        box-shadow: var(--ms-shadow);
        margin-bottom: 18px;
      }

      .month-display {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .month-button {
        width: 38px;
        height: 38px;
        border: 1px solid var(--ms-border);
        background: var(--ms-white);
        border-radius: 12px;
        font-size: 22px;
        line-height: 1;
        color: var(--ms-blue-dark);
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .month-button:hover {
        transform: translateY(-1px);
      }

      .month-label {
        font-size: clamp(20px, 2vw, 30px);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ms-ink);
      }

      .month-summary {
        background: linear-gradient(135deg, rgba(15, 108, 189, 0.08), rgba(15, 157, 154, 0.08));
        color: var(--ms-blue-dark);
        border: 1px solid rgba(15, 108, 189, 0.14);
        border-radius: 12px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 18px;
      }

      .filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: white;
        box-shadow: 0 8px 16px rgba(10, 18, 29, 0.08);
      }

      .filter-pill::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        display: inline-block;
      }

      .filter-pill.newsletter { background: linear-gradient(135deg, #6b4ecb, #8b5cf6); }
      .filter-pill.workshop { background: linear-gradient(135deg, #0f6cbd, #3a92da); }
      .filter-pill.executive { background: linear-gradient(135deg, #0f9d9a, #3fc8c5); }
      .filter-pill.partner { background: linear-gradient(135deg, #d97706, #f59e0b); }
      .filter-pill.summit { background: linear-gradient(135deg, #2e7d32, #4fa65b); }
      .filter-pill.internal { background: linear-gradient(135deg, #c62828, #ef4444); }

      .highlight-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 18px;
      }

      .summary-card {
        background: var(--ms-panel);
        border-radius: 16px;
        border: 1px solid var(--ms-border);
        padding: 16px 18px;
        box-shadow: var(--ms-shadow);
      }

      .summary-card .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ms-blue-dark);
        font-weight: 800;
      }

      .summary-card .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0f6cbd, #0f9d9a);
        display: inline-block;
      }

      .summary-card h3 {
        margin: 10px 0 6px;
        font-size: 24px;
        color: var(--ms-ink);
        line-height: 1.2;
      }

      .summary-card p {
        margin: 0;
        color: var(--ms-muted);
        font-size: 13px;
      }

      .calendar-shell {
        border: 1px solid var(--ms-border);
        background: rgba(255,255,255,0.78);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--ms-shadow);
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekday,
      .cell {
        border-right: 1px solid var(--ms-border);
        border-bottom: 1px solid var(--ms-border);
      }

      .weekday {
        padding: 12px 0 14px;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ms-blue-dark);
        background: linear-gradient(180deg, rgba(15, 108, 189, 0.06), rgba(15, 157, 154, 0.03));
      }

      .cell {
        min-height: 158px;
        padding: 8px 8px 10px;
        background: rgba(255,255,255,0.14);
        position: relative;
      }

      .cell.empty {
        background: #f8fafc;
      }

      .cell.today {
        background: linear-gradient(180deg, rgba(15, 108, 189, 0.04), rgba(15, 157, 154, 0.02));
      }

      .day-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        border-radius: 9px;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 800;
        color: var(--ms-ink);
      }

      .cell.today .day-index {
        background: linear-gradient(135deg, var(--ms-blue), var(--ms-teal));
        color: white;
      }

      .event {
        border-radius: 10px;
        padding: 8px 10px 8px 12px;
        margin-bottom: 8px;
        background: rgba(255,255,255,0.72);
        border-left: 4px solid var(--event-color, var(--ms-blue));
        box-shadow: 0 4px 8px rgba(15, 23, 42, 0.04);
      }

      .event .title {
        display: block;
        font-size: 12px;
        line-height: 1.45;
        font-weight: 800;
        color: var(--ms-ink);
        margin-bottom: 5px;
      }

      .event .meta {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 700;
        color: var(--ms-muted);
      }

      .event .meta::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--event-color, var(--ms-blue));
        display: inline-block;
      }

      .event a {
        display: inline-block;
        margin-top: 8px;
        color: var(--ms-blue);
        text-decoration: none;
        font-size: 11px;
        font-weight: 800;
      }

      .event a:hover {
        text-decoration: underline;
      }

      .event.newsletter { --event-color: #7c4dff; }
      .event.workshop { --event-color: #0f6cbd; }
      .event.executive { --event-color: #0f9d9a; }
      .event.partner { --event-color: #d97706; }
      .event.summit { --event-color: #2e7d32; }
      .event.internal { --event-color: #c62828; }

      @media (max-width: 900px) {
        .highlight-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        body { padding: 16px 12px 24px; }
        .topbar,
        .month-banner {
          flex-direction: column;
          align-items: flex-start;
        }
        .calendar { min-width: 680px; }
        .calendar-shell { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="title-wrap">
          <div class="ms-logo" aria-label="Microsoft logo"></div>
          <div>
            <h1>Microsoft Korea 전략본부 Calendar</h1>
            <p>Strategy &amp; Executive Engagement Tracker</p>
          </div>
        </div>

        <div class="month-nav" aria-label="월 선택">
          <button type="button" id="prevMonthBtn">지난 달</button>
          <button type="button" id="currentMonthBtn" class="active">이번 달</button>
          <button type="button" id="nextMonthBtn">다음 달</button>
        </div>
      </div>

      <div class="month-banner">
        <div class="month-display">
          <button class="month-button" id="monthPrevBtn" aria-label="이전 달">‹</button>
          <div class="month-label" id="monthLabel">2026년 10월</div>
          <button class="month-button" id="monthNextBtn" aria-label="다음 달">›</button>
        </div>
        <div class="month-summary" id="monthSummary">주요 일정 요약</div>
      </div>

      <div class="filter-row" aria-label="카테고리 필터">
        <span class="filter-pill newsletter">Newsletter</span>
        <span class="filter-pill workshop">Workshop</span>
        <span class="filter-pill executive">Executive</span>
        <span class="filter-pill partner">Partner</span>
        <span class="filter-pill summit">Summit</span>
        <span class="filter-pill internal">Internal</span>
      </div>

      <div class="highlight-grid">
        <div class="summary-card">
          <div class="eyebrow">Key focus</div>
          <h3 id="focusCount">5</h3>
          <p>이번 달 주요 이벤트</p>
        </div>
        <div class="summary-card">
          <div class="eyebrow">Executive</div>
          <h3 id="executiveCount">2</h3>
          <p>리더십 제안 및 브리핑</p>
        </div>
        <div class="summary-card">
          <div class="eyebrow">Partner</div>
          <h3 id="partnerCount">3</h3>
          <p>파트너 및 산업 행사</p>
        </div>
      </div>

      <div class="calendar-shell">
        <div class="calendar" id="calendar" aria-label="월별 캘린더"></div>
      </div>
    </div>

    <script>
      const today = new Date(2026, 9, 26);
      const monthState = {
        year: today.getFullYear(),
        monthIndex: today.getMonth()
      };

      const eventsByDate = {
        '2026-09-10': [
          {
            title: 'SMEC KR CxO Letter',
            type: 'Newsletter',
            category: 'newsletter',
            link: 'SMEC_KR_CxO_Letter_Sep2026_FINAL.html'
          }
        ],
        '2026-09-15': [
          {
            title: 'Copilot & Agent Day Hands-on Workshop',
            type: 'Workshop',
            category: 'workshop',
            link: '[Wrap-up]0915_Copilot_Agent_Day_Hands-on_Workshop_with_SoftwareOne_0915.html'
          }
        ],
        '2026-09-30': [
          {
            title: 'Industry Summit Leadership Connection',
            type: 'Summit',
            category: 'summit',
            link: '[Wrap-up_KR] SME&C Leadership Connection at Microsoft Industry Summit (9_30, COEX)_FINAL.html'
          }
        ],
        '2026-10-08': [
          {
            title: 'SMEC KR CxO Letter',
            type: 'Newsletter',
            category: 'newsletter',
            link: 'SMEC_KR_CxO_Letter_Oct2026_FINAL.html'
          }
        ],
        '2026-10-21': [
          {
            title: 'Copilot & Agent Day with 씨앤토트',
            type: 'Workshop',
            category: 'workshop',
            link: '[Wrap-up]10월21일_Copilot_Agent_Day_with_씨앤토트_KR.html'
          }
        ],
        '2026-10-29': [
          {
            title: 'Strategy Review & Executive Briefing',
            type: 'Executive',
            category: 'executive',
            link: 'IDMA_Hackathon_Wrap-up_Report(KR).html'
          }
        ],
        '2026-11-05': [
          {
            title: 'Partner Enablement Forum',
            type: 'Partner',
            category: 'partner',
            link: 'IDMA_Hackathon_Wrap-up_Report(KR).html'
          }
        ],
        '2026-11-12': [
          {
            title: 'AI Transformation Briefing',
            type: 'Executive',
            category: 'executive',
            link: 'SMEC_KR_CxO_Letter_Oct2026_FINAL.html'
          }
        ],
        '2026-11-18': [
          {
            title: 'Customer Advisory Roundtable',
            type: 'Internal',
            category: 'internal',
            link: 'SMEC_KR_CxO_Letter_Sep2026_FINAL.html'
          }
        ]
      };

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function getMonthKey(year, monthIndex, day) {
        return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      function updateMonthLabel() {
        const label = document.getElementById('monthLabel');
        label.textContent = `${monthState.year}년 ${monthState.monthIndex + 1}월`;
      }

      function getCategorySummary() {
        const categories = { newsletter: 0, workshop: 0, executive: 0, partner: 0, summit: 0, internal: 0 };
        const year = monthState.year;
        const monthIndex = monthState.monthIndex;
        const lastDay = new Date(year, monthIndex + 1, 0).getDate();

        for (let day = 1; day <= lastDay; day++) {
          const key = getMonthKey(year, monthIndex, day);
          (eventsByDate[key] || []).forEach((item) => {
            if (categories[item.category] !== undefined) {
              categories[item.category] += 1;
            }
          });
        }

        return categories;
      }

      function updateMonthSummary() {
        const summary = document.getElementById('monthSummary');
        const summaryMap = getCategorySummary();
        const total = Object.values(summaryMap).reduce((sum, value) => sum + value, 0);

        if (total === 0) {
          summary.textContent = '등록된 이벤트 없음';
        } else {
          summary.textContent = `${total}개 일정 • ${summaryMap.workshop || 0}개 워크샵`;
        }

        const focus = document.getElementById('focusCount');
        focus.textContent = String(total || 0);

        const executiveCount = document.getElementById('executiveCount');
        executiveCount.textContent = String(summaryMap.executive || 0);

        const partnerCount = document.getElementById('partnerCount');
        partnerCount.textContent = String((summaryMap.partner || 0) + (summaryMap.summit || 0));
      }

      function renderCalendar() {
        const calendar = document.getElementById('calendar');
        calendar.innerHTML = '';

        weekdays.forEach((label) => {
          const wd = document.createElement('div');
          wd.className = 'weekday';
          wd.textContent = label;
          calendar.appendChild(wd);
        });

        const year = monthState.year;
        const monthIndex = monthState.monthIndex;
        const firstDay = new Date(year, monthIndex, 1).getDay();
        const totalDays = new Date(year, monthIndex + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'cell empty';
          calendar.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dateKey = getMonthKey(year, monthIndex, day);
          const cell = document.createElement('div');
          cell.className = 'cell';

          const isToday = day === today.getDate() && monthIndex === today.getMonth() && year === today.getFullYear();
          if (isToday) cell.classList.add('today');

          const dayLabel = document.createElement('span');
          dayLabel.className = 'day-index';
          dayLabel.textContent = day;
          cell.appendChild(dayLabel);

          const dayEvents = eventsByDate[dateKey] || [];
          dayEvents.forEach((event) => {
            const eventBox = document.createElement('div');
            eventBox.className = `event ${event.category}`;

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = event.title;

            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = event.type;

            const link = document.createElement('a');
            link.href = event.link || '#';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '상세 보기';

            eventBox.appendChild(title);
            eventBox.appendChild(meta);
            eventBox.appendChild(link);
            cell.appendChild(eventBox);
          });

          calendar.appendChild(cell);
        }
      }

      function moveToMonth(offset) {
        const target = new Date(monthState.year, monthState.monthIndex + offset, 1);
        monthState.year = target.getFullYear();
        monthState.monthIndex = target.getMonth();
        updateMonthLabel();
        updateMonthSummary();
        renderCalendar();
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => moveToMonth(-1));
      document.getElementById('currentMonthBtn').addEventListener('click', () => {
        monthState.year = today.getFullYear();
        monthState.monthIndex = today.getMonth();
        updateMonthLabel();
        updateMonthSummary();
        renderCalendar();
      });
      document.getElementById('nextMonthBtn').addEventListener('click', () => moveToMonth(1));
      document.getElementById('monthPrevBtn').addEventListener('click', () => moveToMonth(-1));
      document.getElementById('monthNextBtn').addEventListener('click', () => moveToMonth(1));

      updateMonthLabel();
      updateMonthSummary();
      renderCalendar();
    </script>
  </body>
</html>
