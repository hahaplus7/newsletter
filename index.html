<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SME&C Korea | CxO Newsletter Calendar</title>
    <style>
      :root {
        --ink: #111827;
        --ink-soft: #475467;
        --line: #e5e7eb;
        --panel: rgba(255, 255, 255, 0.9);
        --bg-1: #f7f8fb;
        --bg-2: #eef3ff;
        --navy: #112a52;
        --navy-2: #1e3a5f;
        --blue: #1f4ea3;
        --blue-soft: #edf4ff;
        --gold: #c7a15b;
        --gold-soft: #f9f0db;
        --silver: #dfe5ee;
        --shadow: 0 22px 50px rgba(17, 24, 39, 0.08);
        --radius: 26px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(31, 78, 163, 0.07), transparent 25%),
          linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
        color: var(--ink);
        min-height: 100vh;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 56px 18px 72px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand-mark {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold), var(--blue));
        box-shadow: 0 0 0 6px rgba(31, 78, 163, 0.08);
      }

      .eyebrow {
        margin: 0;
        color: var(--blue);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .hero {
        text-align: center;
        margin-bottom: 34px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 4vw, 54px);
        line-height: 1.1;
        letter-spacing: -0.06em;
        color: var(--navy);
      }

      .subtitle {
        max-width: 820px;
        margin: 16px auto 0;
        font-size: 17px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(285px, 1fr));
        gap: 24px;
        margin-bottom: 26px;
      }

      .month-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 22px 18px 18px;
        backdrop-filter: blur(4px);
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .month-name {
        font-size: clamp(24px, 2vw, 30px);
        font-weight: 800;
        color: var(--navy);
      }

      .year-tag {
        font-size: 12px;
        font-weight: 700;
        color: var(--blue);
        background: var(--blue-soft);
        border-radius: 999px;
        padding: 8px 12px;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .weekdays {
        margin-bottom: 10px;
      }

      .weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 4px 0 8px;
      }

      .day {
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        border: 1px solid transparent;
        font-size: 15px;
        color: var(--ink);
        background: transparent;
      }

      .day.empty {
        visibility: hidden;
      }

      .day.release {
        background: linear-gradient(180deg, var(--gold-soft) 0%, #fffaf0 100%);
        border-color: rgba(199, 161, 91, 0.45);
        color: #704f08;
        font-weight: 800;
      }

      .day.release a {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: inherit;
      }

      .day.future {
        background: #f8fafc;
        border-color: #ecf1f6;
        color: #9aa5b1;
      }

      .issue-link {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-top: 18px;
        padding: 14px 18px;
        border-radius: 14px;
        background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
        color: white;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow: 0 14px 28px rgba(17, 42, 82, 0.18);
      }

      .issue-link:hover {
        filter: brightness(1.04);
      }

      .issue-link.disabled {
        background: linear-gradient(180deg, #dfe5ee 0%, #e9eef5 100%);
        color: #73829a;
        box-shadow: none;
        pointer-events: none;
      }

      .history {
        margin-top: 24px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px 20px;
      }

      .history h2 {
        margin: 0 0 16px;
        font-size: 24px;
        color: var(--navy);
      }

      .history-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .history-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
      }

      .history-item a {
        text-decoration: none;
        color: var(--navy);
        font-weight: 700;
      }

      .reference {
        margin-top: 20px;
        padding: 18px 20px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255, 253, 250, 0.8), rgba(245, 247, 250, 0.8));
        border: 1px solid rgba(199, 161, 91, 0.45);
      }

      .reference strong {
        display: inline-block;
        margin-right: 8px;
        color: var(--navy);
      }

      .reference a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .calendar-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <span class="brand-mark" aria-hidden="true"></span>
        <p class="eyebrow">Microsoft SME&amp;C Korea</p>
      </div>

      <header class="hero">
        <h1>SME&amp;C Korea CxO Newsletter</h1>
        <p class="subtitle">
          월간 뉴스레터 발행 일정과 아카이브를 한 번에 확인할 수 있는 공개 캘린더입니다.<br />
          고객이 공개 URL로 접속해 각 월의 최신 뉴스레터와 과거 발행 이력을 모두 확인할 수 있습니다.
        </p>
      </header>

      <main>
        <div class="calendar-grid" id="calendarGrid"></div>

        <section class="history" aria-label="Historical newsletters">
          <h2>Historical Newsletters</h2>
          <div class="history-list">
            <div class="history-item">
              <span>September 2026</span>
              <a href="./SMEC_KR_CxO_Letter_Sep2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
            </div>
            <div class="history-item">
              <span>October 2026</span>
              <a href="./SMEC_KR_CxO_Letter_Oct2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
            </div>
          </div>
        </section>

        <div class="reference">
          <strong>Marketing calendar reference:</strong>
          <a href="https://janeeyye.github.io/marketing-calendar-public/" target="_blank" rel="noopener noreferrer">Open Microsoft-style marketing calendar</a>
        </div>
      </main>
    </div>

    <script>
      const monthConfig = [
        {
          year: 2026,
          monthIndex: 8,
          monthName: 'September',
          releaseDate: 21,
          href: './SMEC_KR_CxO_Letter_Sep2026_FINAL.html',
          description: 'September issue • 2026.09.21'
        },
        {
          year: 2026,
          monthIndex: 9,
          monthName: 'October',
          releaseDate: 15,
          href: './SMEC_KR_CxO_Letter_Oct2026_FINAL.html',
          description: 'October issue • 2026.10.15'
        },
        {
          year: 2026,
          monthIndex: 10,
          monthName: 'November',
          releaseDate: 12,
          href: '#',
          description: 'Scheduled • 2026.11.12',
          future: true
        },
        {
          year: 2026,
          monthIndex: 11,
          monthName: 'December',
          releaseDate: 10,
          href: '#',
          description: 'Scheduled • 2026.12.10',
          future: true
        }
      ];

      function renderMonthCard(config) {
        const card = document.createElement('section');
        card.className = 'month-card';

        const header = document.createElement('div');
        header.className = 'month-header';

        const monthName = document.createElement('div');
        monthName.className = 'month-name';
        monthName.textContent = config.monthName;

        const yearTag = document.createElement('span');
        yearTag.className = 'year-tag';
        yearTag.textContent = config.year;

        header.appendChild(monthName);
        header.appendChild(yearTag);

        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const weekdayRow = document.createElement('div');
        weekdayRow.className = 'weekdays';
        weekdays.forEach((day) => {
          const el = document.createElement('div');
          el.className = 'weekday';
          el.textContent = day;
          weekdayRow.appendChild(el);
        });

        const daysWrap = document.createElement('div');
        daysWrap.className = 'days';

        const firstDay = new Date(config.year, config.monthIndex, 1).getDay();
        const totalDays = new Date(config.year, config.monthIndex + 1, 0).getDate();

        for (let i = 0; i < firstDay; i += 1) {
          const empty = document.createElement('div');
          empty.className = 'day empty';
          empty.textContent = ' ';
          daysWrap.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day += 1) {
          const cell = document.createElement('div');
          cell.className = 'day';

          if (!config.future && day === config.releaseDate) {
            cell.classList.add('release');
            const link = document.createElement('a');
            link.href = config.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = day;
            cell.appendChild(link);
          } else if (config.future && day === config.releaseDate) {
            cell.classList.add('future');
            cell.textContent = day;
          } else {
            cell.textContent = day;
          }

          daysWrap.appendChild(cell);
        }

        const link = document.createElement('a');
        link.className = 'issue-link' + (config.future ? ' disabled' : '');
        link.href = config.future ? '#' : config.href;
        link.target = config.future ? '' : '_blank';
        link.rel = config.future ? '' : 'noopener noreferrer';
        link.textContent = config.description;

        if (config.future) {
          link.addEventListener('click', (event) => {
            event.preventDefault();
          });
        }

        card.appendChild(header);
        card.appendChild(weekdayRow);
        card.appendChild(daysWrap);
        card.appendChild(link);

        return card;
      }

      const grid = document.getElementById('calendarGrid');
      monthConfig.forEach((config) => {
        grid.appendChild(renderMonthCard(config));
      });
    </script>
  </body>
</html>
