<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft 전략본부 뉴스레터</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --bg-2: #edf4ff;
        --panel: rgba(255, 255, 255, 0.94);
        --panel-strong: #ffffff;
        --ink: #1b2430;
        --ink-soft: #58677a;
        --line: #e7edf5;
        --navy: #172b4d;
        --blue: #0f6cbd;
        --blue-2: #0b4d8c;
        --gold: #c9a76a;
        --gold-soft: #f8f1df;
        --red: #f25022;
        --green: #7fba00;
        --sky: #00a4ef;
        --amber: #ffb900;
        --shadow: 0 26px 60px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 108, 189, 0.10), transparent 22%),
          linear-gradient(180deg, #fafcff 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 42px 18px 70px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .microsoft-mark {
        display: grid;
        grid-template-columns: repeat(2, 10px);
        gap: 4px;
        padding: 5px;
        border-radius: 10px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.04);
      }

      .microsoft-mark span {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }

      .red { background: var(--red); }
      .green { background: var(--green); }
      .blue { background: var(--sky); }
      .yellow { background: var(--amber); }

      .eyebrow {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--blue);
        font-weight: 700;
      }

      .hero {
        text-align: center;
        margin-bottom: 30px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(32px, 4vw, 58px);
        letter-spacing: -0.06em;
        color: var(--navy);
      }

      .hero p {
        max-width: 850px;
        margin: 16px auto 0;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.7;
      }

      .calendar-shell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 20px 18px 18px;
        box-shadow: var(--shadow);
      }

      .month-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }

      .nav-btn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: white;
        box-shadow: 0 8px 18px rgba(17, 24, 39, 0.04);
        color: var(--navy);
        font-size: 30px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .nav-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(17, 24, 39, 0.08);
      }

      .month-pill {
        min-width: 340px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 14px 20px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: white;
        box-shadow: 0 8px 18px rgba(17, 24, 39, 0.04);
      }

      .month-pill .year {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      .month-pill .month {
        font-size: clamp(28px, 2.5vw, 38px);
        font-weight: 800;
        letter-spacing: -0.05em;
        color: var(--navy);
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
      }

      .weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 6px 0 10px;
      }

      .day {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        border: 1px solid transparent;
        font-size: 16px;
        color: var(--ink);
        background: transparent;
      }

      .day.empty {
        visibility: hidden;
      }

      .day.release {
        background: linear-gradient(180deg, var(--gold-soft) 0%, #fffdf8 100%);
        border-color: rgba(201, 167, 106, 0.52);
        font-weight: 800;
        color: #754d07;
      }

      .day.release a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: inherit;
        text-decoration: none;
      }

      .day.future {
        background: #f8fafc;
        border-color: var(--line);
        color: #99a7b9;
      }

      .issue-panel {
        margin-top: 24px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }

      .issue-panel .badge {
        display: inline-block;
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--blue-2);
        color: white;
        font-size: 11px;
        letter-spacing: 0.14em;
        font-weight: 700;
        text-transform: uppercase;
      }

      .issue-panel h2 {
        margin: 0 0 8px;
        font-size: clamp(28px, 3vw, 42px);
        letter-spacing: -0.05em;
        color: var(--navy);
      }

      .issue-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .issue-meta .chip {
        padding: 7px 10px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
      }

      .issue-panel a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 20px;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--blue) 0%, var(--blue-2) 100%);
        color: white;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 15px 30px rgba(15, 108, 189, 0.18);
      }

      .issue-panel a[disabled], .issue-panel a.disabled {
        background: linear-gradient(180deg, #dfe8f0 0%, #eef3f8 100%);
        color: #76879d;
        box-shadow: none;
        pointer-events: none;
      }

      .archive {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }

      .archive-card {
        background: rgba(255,255,255,0.82);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .archive-card span {
        font-weight: 700;
        color: var(--navy);
      }

      .archive-card a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
      }

      .reference {
        margin-top: 20px;
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(245,247,250,0.9));
        border: 1px solid rgba(201, 167, 106, 0.46);
      }

      .reference strong {
        color: var(--navy);
      }

      .reference a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .month-pill {
          min-width: 220px;
        }

        .calendar {
          gap: 7px;
        }

        .day {
          height: 46px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="microsoft-mark" aria-label="Microsoft logo">
          <span class="red"></span>
          <span class="green"></span>
          <span class="blue"></span>
          <span class="yellow"></span>
        </div>
        <p class="eyebrow">Microsoft 전략본부</p>
      </div>

      <header class="hero">
        <h1>뉴스레터</h1>
        <p>
          전략과 인사이트를 정기적으로 전달하는 월간 브리프를 한 달 단위로 보며,
          이전/다음 월로 빠르게 이동해 최신 발행 내용과 과거 이슈를 함께 확인할 수 있습니다.
        </p>
      </header>

      <main>
        <div class="calendar-shell">
          <div class="month-nav">
            <button class="nav-btn" id="prevBtn" aria-label="이전 달">&#8249;</button>
            <div class="month-pill">
              <span class="year" id="yearLabel">2026</span>
              <span class="month" id="monthLabel">September</span>
            </div>
            <button class="nav-btn" id="nextBtn" aria-label="다음 달">&#8250;</button>
          </div>

          <div class="calendar" id="calendar"></div>

          <div class="issue-panel" id="issuePanel"></div>
        </div>

        <div class="archive" aria-label="newsletter archive">
          <div class="archive-card">
            <span>September</span>
            <a href="./SMEC_KR_CxO_Letter_Sep2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
          <div class="archive-card">
            <span>October</span>
            <a href="./SMEC_KR_CxO_Letter_Oct2026_FINAL.html" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
          <div class="archive-card">
            <span>November</span>
            <a href="#" onclick="return false;">Scheduled</a>
          </div>
          <div class="archive-card">
            <span>December</span>
            <a href="#" onclick="return false;">Scheduled</a>
          </div>
        </div>

        <div class="reference">
          <strong>Reference calendar:</strong>
          <a href="https://janeeyye.github.io/marketing-calendar-public/" target="_blank" rel="noopener noreferrer">Open Microsoft-style marketing calendar</a>
        </div>
      </main>
    </div>

    <script>
      const monthNames = [
        'January','February','March','April','May','June',
        'July','August','September','October','November','December'
      ];

      const issues = {
        '2026-09': {
          label: 'September issue',
          date: '2026.09.21',
          href: './SMEC_KR_CxO_Letter_Sep2026_FINAL.html',
          future: false
        },
        '2026-10': {
          label: 'October issue',
          date: '2026.10.15',
          href: './SMEC_KR_CxO_Letter_Oct2026_FINAL.html',
          future: false
        },
        '2026-11': {
          label: 'November issue',
          date: '2026.11.12',
          href: '#',
          future: true
        },
        '2026-12': {
          label: 'December issue',
          date: '2026.12.10',
          href: '#',
          future: true
        }
      };

      let viewDate = new Date(2026, 8, 1);

      function keyFromDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthLabel = document.getElementById('monthLabel');
        const yearLabel = document.getElementById('yearLabel');
        const y = viewDate.getFullYear();
        const m = viewDate.getMonth();

        monthLabel.textContent = monthNames[m];
        yearLabel.textContent = y;

        calendar.innerHTML = '';

        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        weekdays.forEach((day) => {
          const el = document.createElement('div');
          el.className = 'weekday';
          el.textContent = day;
          calendar.appendChild(el);
        });

        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const releaseDate = issues[keyFromDate(viewDate)] ? getIssueDay(y, m) : null;

        for (let i = 0; i < firstDay; i += 1) {
          const blank = document.createElement('div');
          blank.className = 'day empty';
          calendar.appendChild(blank);
        }

        for (let day = 1; day <= totalDays; day += 1) {
          const cell = document.createElement('div');
          cell.className = 'day';

          if (releaseDate && day === releaseDate) {
            const info = issues[keyFromDate(viewDate)];
            if (info && !info.future) {
              cell.classList.add('release');
              const link = document.createElement('a');
              link.href = info.href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = day;
              cell.appendChild(link);
            } else {
              cell.classList.add('future');
              cell.textContent = day;
            }
          } else {
            cell.textContent = day;
          }

          calendar.appendChild(cell);
        }

        renderIssuePanel();
      }

      function getIssueDay(year, monthIndex) {
        const issueInfo = issues[`${year}-${String(monthIndex + 1).padStart(2, '0')}`];
        if (!issueInfo) return null;

        const dayMap = {
          '2026-09': 21,
          '2026-10': 15,
          '2026-11': 12,
          '2026-12': 10
        };

        return dayMap[`${year}-${String(monthIndex + 1).padStart(2, '0')}`] || null;
      }

      function renderIssuePanel() {
        const key = keyFromDate(viewDate);
        const info = issues[key];
        const panel = document.getElementById('issuePanel');

        if (!info) {
          panel.innerHTML = '';
          return;
        }

        const isFuture = info.future;
        panel.innerHTML = `
          <div class="badge">${isFuture ? 'Scheduled' : 'Published'}</div>
          <h2>${info.label}</h2>
          <div class="issue-meta">
            <span class="chip">Release: ${info.date}</span>
            <span class="chip">${monthNames[viewDate.getMonth()]}</span>
            <span class="chip">${viewDate.getFullYear()}</span>
          </div>
          <a href="${isFuture ? '#' : info.href}" target="${isFuture ? '' : '_blank'}" rel="${isFuture ? '' : 'noopener noreferrer'}" class="${isFuture ? 'disabled' : ''}" ${isFuture ? 'onclick="return false;"' : ''}>
            ${isFuture ? 'Coming soon' : 'Open newsletter'}
          </a>
        `;
      }

      document.getElementById('prevBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
        renderCalendar();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
        renderCalendar();
      });

      renderCalendar();
    </script>
  </body>
</html>
